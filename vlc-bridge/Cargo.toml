[package]
name = "vaultdrive-vlc"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
aes-gcm = "0.10"
age = { version = "0.12.1", default-features = false }
bytes = "1"
hex = "0.4"
hmac = "0.12"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros", "net", "sync", "time", "signal"] }
zeroize = "1"

[target.'cfg(windows)'.dependencies]
cap-fs-ext = "3"
cap-std = "3"
windows-sys = { version = "0.61", features = [
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
